# SonarQube/SonarCloud Configuration

# PROJECT IDENTIFICATION
# You must replace these with your actual values from SonarCloud/SonarQube
# sonar.projectKey=your-org_vital-forge-v1
# sonar.organization=your-org

# PROJECT META
sonar.projectName=VitalForge V1
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8

# EXCLUSIONS
# Ignore vendor (libraries), db (migrations), bin (executables), and test files for code analysis
sonar.exclusions=bin/**/*,db/**/*,spec/**/*,test/**/*,tmp/**/*,vendor/**/*,log/**/*,config/**/*,public/**/*

# TEST COVERAGE & LINTERS
# Path to the SimpleCov JSON report
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# Path to the RuboCop JSON report
sonar.ruby.rubocop.reportPaths=rubocop-result.json

