---
openapi: 3.0.1
info:
  title: VitalForge API V1
  version: v1
  description: VitalForge Fitness Tracking Application API - Authentication and User
    Management
  contact:
    name: VitalForge Team
    email: support@vitalforge.com
paths:
  "/api/v1/csrf":
    get:
      summary: Get CSRF Token
      tags:
      - API Authentication
      description: Retrieves a CSRF token for subsequent authenticated requests. The
        token is also set as a cookie.
      responses:
        '200':
          description: CSRF token retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    example: abc123xyz...
                required:
                - csrfToken
  "/api/v1/login":
    post:
      summary: Login (JSON API)
      tags:
      - API Authentication
      description: Authenticates a user via JSON API and creates a session. Returns
        user data on success.
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: john.doe@example.com
                          first_name:
                            type: string
                            example: John
                          last_name:
                            type: string
                            example: Doe
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: john.doe@example.com
                    password:
                      type: string
                      format: password
                      example: Password123!
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/current_user":
    get:
      summary: Get Current User
      tags:
      - API Authentication
      description: Returns the currently authenticated user's information
      responses:
        '200':
          description: user found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not signed in
  "/api/v1/logout":
    delete:
      summary: Logout (JSON API)
      tags:
      - API Authentication
      description: Logs out the current user and destroys the session
      responses:
        '204':
          description: logout successful
  "/login":
    post:
      summary: User login
      tags:
      - Authentication
      description: Authenticates a user and creates a session. Returns HTML redirect
        on success or renders login form with errors.
      parameters: []
      responses:
        '302':
          description: successful login - redirects to dashboard
        '422':
          description: account locked
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
              required:
              - email
              - password
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                password:
                  type: string
                  format: password
                  example: Password123!
              required:
              - email
              - password
  "/logout":
    delete:
      summary: User logout
      tags:
      - Authentication
      description: Logs out the current user and destroys their session. Requires
        active session.
      responses:
        '302':
          description: logout without session - still redirects
  "/users":
    post:
      summary: User registration
      tags:
      - Users
      - Authentication
      description: Creates a new user account. Automatically logs in the user and
        creates a session on success.
      parameters: []
      responses:
        '302':
          description: user created successfully - redirects to dashboard
        '422':
          description: validation failed - invalid email format
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                  description: User email address (must be unique)
                password:
                  type: string
                  format: password
                  example: SecurePass123!
                  description: User password (minimum 8 characters)
                password_confirmation:
                  type: string
                  format: password
                  example: SecurePass123!
                  description: Password confirmation (must match password)
                first_name:
                  type: string
                  example: John
                  description: User first name
                last_name:
                  type: string
                  example: Doe
                  description: User last name
              required:
              - email
              - password
              - password_confirmation
              - first_name
              - last_name
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                  description: User email address (must be unique)
                password:
                  type: string
                  format: password
                  example: SecurePass123!
                  description: User password (minimum 8 characters)
                password_confirmation:
                  type: string
                  format: password
                  example: SecurePass123!
                  description: Password confirmation (must match password)
                first_name:
                  type: string
                  example: John
                  description: User first name
                last_name:
                  type: string
                  example: Doe
                  description: User last name
              required:
              - email
              - password
              - password_confirmation
              - first_name
              - last_name
servers:
- url: http://localhost:3000
  description: Development server
- url: https://api.vitalforge.com
components:
  securitySchemes:
    csrf_token:
      type: apiKey
      name: X-CSRF-Token
      in: header
      description: CSRF protection token (required for POST/PUT/DELETE)
    session_cookie:
      type: apiKey
      name: Cookie
      in: header
      description: Session cookie (automatically set after login)
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: john.doe@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        full_name:
          type: string
          example: John Doe
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - email
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: SecurePass123!
        password_confirmation:
          type: string
          format: password
          example: SecurePass123!
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
      required:
      - email
      - password
      - password_confirmation
      - first_name
      - last_name
    LoginCredentials:
      type: object
      properties:
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: SecurePass123!
      required:
      - email
      - password
    Error:
      type: object
      properties:
        error:
          type: string
          example: Invalid email or password
    ValidationErrors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - can't be blank
            - is invalid
            password:
            - is too short (minimum is 8 characters)
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: Successfully logged out
tags:
- name: Authentication
  description: User authentication operations (login, logout, signup)
- name: Users
  description: User account management operations
