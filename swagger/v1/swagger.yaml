---
openapi: 3.0.1
info:
  title: VitalForge API V1
  version: v1
  description: VitalForge Fitness Tracking Application API - Authentication, Workouts,
    Templates, Exercise Sets, User Preferences, and Weekly AI Feedback
  contact:
    name: VitalForge Team
    email: support@vitalforge.com
paths:
  "/api/v1/health":
    get:
      summary: Health check
      operationId: getHealth
      tags:
      - Health
      description: Returns 200 OK if the API is up. Used by load balancers and uptime
        monitors.
      responses:
        '200':
          description: API is healthy
  "/api/v1/csrf":
    get:
      summary: Get CSRF Token
      operationId: getCsrfToken
      tags:
      - API Authentication
      description: Retrieves a CSRF token for subsequent authenticated requests. The
        token is also set as a cookie.
      responses:
        '200':
          description: CSRF token retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
                    example: abc123xyz...
                required:
                - csrfToken
  "/api/v1/login":
    post:
      summary: Login (JSON API)
      operationId: login
      tags:
      - API Authentication
      description: Authenticates a user via JSON API and creates a session. Returns
        user data on success.
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: john.doe@example.com
                          first_name:
                            type: string
                            example: John
                          last_name:
                            type: string
                            example: Doe
        '401':
          description: invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: new.user@example.com
                    password:
                      type: string
                      format: password
                      example: SecurePass123!
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/current_user":
    get:
      summary: Get Current User
      operationId: getCurrentUser
      tags:
      - API Authentication
      description: Returns the currently authenticated user's information
      responses:
        '200':
          description: user found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
        '401':
          description: not authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Not signed in
  "/api/v1/logout":
    delete:
      summary: Logout (JSON API)
      operationId: logout
      tags:
      - API Authentication
      description: Logs out the current user and destroys the session
      responses:
        '204':
          description: logout successful
  "/api/v1/signup":
    post:
      summary: Register (signup)
      operationId: signup
      tags:
      - Users
      description: Creates a new user account. Automatically logs in the user and
        sets session.
      parameters: []
      responses:
        '201':
          description: user created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          email:
                            type: string
                          first_name:
                            type: string
                          last_name:
                            type: string
                      message:
                        type: string
        '422':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: new.user@example.com
                    password:
                      type: string
                      format: password
                      example: SecurePass123!
                    password_confirmation:
                      type: string
                      format: password
                      example: SecurePass123!
                    first_name:
                      type: string
                      example: New
                    last_name:
                      type: string
                      example: User
                  required:
                  - email
                  - password
                  - password_confirmation
                  - first_name
                  - last_name
              required:
              - user
  "/api/v1/exercise_sets/{id}":
    parameters:
    - name: id
      in: path
      description: Exercise set ID
      required: true
      schema:
        type: integer
    patch:
      summary: Update exercise set
      operationId: updateExerciseSet
      tags:
      - Exercise Sets
      security:
      - bearer_auth: []
      description: Updates an exercise set (reps, weight, completed, notes, etc.).
        Set must belong to the current user's workout. Use the 'Authorize' button
        at the top right to set your JWT token.
      parameters: []
      responses:
        '200':
          description: exercise set updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  exercise_set:
                    "$ref": "#/components/schemas/ExerciseSet"
        '404':
          description: exercise set not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                exercise_set:
                  type: object
                  properties:
                    reps:
                      type: integer
                    weight:
                      type: number
                    weight_unit:
                      type: string
                    rest_after_seconds:
                      type: integer
                    rpe:
                      type: integer
                    to_failure:
                      type: boolean
                    notes:
                      type: string
                    completed:
                      type: boolean
              required:
              - exercise_set
  "/api/v1/mobile/signup":
    post:
      summary: Mobile Signup (Registration)
      operationId: mobileSignup
      tags:
      - Mobile Authentication
      description: Creates a new user account for mobile and returns a JWT token.
        Use this token in the Authorization header for subsequent requests. Copy the
        returned token and click 'Authorize' in Swagger UI to test protected endpoints.
      parameters: []
      responses:
        '201':
          description: signup successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: newuser@example.com
                          first_name:
                            type: string
                            example: John
                          last_name:
                            type: string
                            example: Doe
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsImV4cCI6MTcwMDAwMDAwMCwiaWF0IjoxNjk5OTEzNjAwfQ.abcdef123456
                        description: JWT token - copy this and click 'Authorize' button
                          to use in protected endpoints
                      expires_at:
                        type: string
                        format: date-time
                        example: '2024-11-24T12:00:00Z'
                        description: Token expiration time (24 hours from signup)
                      message:
                        type: string
                        example: Account created successfully! Welcome, John!
        '422':
          description: email already taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    example:
                      email:
                      - has already been taken
                      password:
                      - is too short (minimum is 8 characters)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: newuser@example.com
                    password:
                      type: string
                      format: password
                      example: Password123!
                    password_confirmation:
                      type: string
                      format: password
                      example: Password123!
                    first_name:
                      type: string
                      example: John
                    last_name:
                      type: string
                      example: Doe
                  required:
                  - email
                  - password
                  - password_confirmation
                  - first_name
                  - last_name
              required:
              - user
  "/api/v1/mobile/login":
    post:
      summary: Mobile Login (JWT)
      operationId: mobileLogin
      tags:
      - Mobile Authentication
      description: Authenticates a mobile user and returns a JWT token. Copy the returned
        token and click 'Authorize' in Swagger UI to test protected endpoints.
      parameters: []
      responses:
        '200':
          description: login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: mobile.user@example.com
                          first_name:
                            type: string
                            example: Mobile
                          last_name:
                            type: string
                            example: User
                          full_name:
                            type: string
                            example: Mobile User
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOjEsImVtYWlsIjoidXNlckBleGFtcGxlLmNvbSIsImV4cCI6MTcwMDAwMDAwMCwiaWF0IjoxNjk5OTEzNjAwfQ.abcdef123456
                        description: JWT token - use in Authorization header as 'Bearer
                          <token>'
                      expires_at:
                        type: string
                        format: date-time
                        example: '2024-11-24T12:00:00Z'
                        description: Token expiration time (24 hours from login)
        '401':
          description: user not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                      example: newuser@example.com
                    password:
                      type: string
                      format: password
                      example: Password123!
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/mobile/current_user":
    get:
      summary: Get Current Mobile User
      operationId: getCurrentMobileUser
      tags:
      - Mobile Authentication
      security:
      - bearer_auth: []
      description: Returns the currently authenticated user based on JWT token. First
        login or signup to get a token, then click 'Authorize' button at the top right
        and paste the token.
      responses:
        '200':
          description: current user retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          email:
                            type: string
                            example: mobile.user@example.com
                          first_name:
                            type: string
                            example: Mobile
                          last_name:
                            type: string
                            example: User
                          full_name:
                            type: string
                            example: Mobile User
                          created_at:
                            type: string
                            format: date-time
                          last_login_at:
                            type: string
                            format: date-time
                            nullable: true
        '401':
          description: invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid or expired token
  "/api/v1/mobile/logout":
    delete:
      summary: Mobile Logout
      operationId: mobileLogout
      tags:
      - Mobile Authentication
      security:
      - bearer_auth: []
      description: Logs out the mobile user. Use the 'Authorize' button at the top
        right to set your JWT token. Client should discard the JWT token after this
        call.
      responses:
        '204':
          description: logout successful
        '401':
          description: missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Missing authentication token
  "/api/v1/user_preference":
    get:
      summary: Get user preference
      operationId: getUserPreference
      tags:
      - User Preferences
      security:
      - bearer_auth: []
      description: Returns the current user's preferences (onboarding, goals, training
        days, etc.). Use the 'Authorize' button at the top right to set your JWT token.
      responses:
        '200':
          description: preference found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserPreference"
        '404':
          description: preference not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: unauthorized
    post:
      summary: Create user preference
      operationId: createUserPreference
      tags:
      - User Preferences
      security:
      - bearer_auth: []
      description: Creates or initializes user preferences. If primary_goal and training_days_per_week
        are set, onboarding is marked complete. Use the 'Authorize' button at the
        top right to set your JWT token.
      parameters: []
      responses:
        '201':
          description: preference created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserPreference"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_preference:
                  type: object
                  properties:
                    primary_goal:
                      type: string
                      enum:
                      - physique
                      - strength
                    training_days_per_week:
                      type: integer
                    preferred_workout_duration:
                      type: integer
                    experience_level:
                      type: string
                      enum:
                      - Beginner
                      - Intermediate
                      - Advanced
              required:
              - user_preference
    patch:
      summary: Update user preference
      operationId: updateUserPreference
      tags:
      - User Preferences
      security:
      - bearer_auth: []
      description: Updates the current user's preferences. Use the 'Authorize' button
        at the top right to set your JWT token.
      parameters: []
      responses:
        '200':
          description: preference updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/UserPreference"
        '422':
          description: validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_preference:
                  type: object
                  properties:
                    primary_goal:
                      type: string
                      enum:
                      - physique
                      - strength
                    training_days_per_week:
                      type: integer
                    preferred_workout_duration:
                      type: integer
                    experience_level:
                      type: string
                      enum:
                      - Beginner
                      - Intermediate
                      - Advanced
              required:
              - user_preference
  "/api/v1/weekly_feedbacks/current":
    get:
      summary: Get current weekly feedback
      operationId: getCurrentWeeklyFeedback
      tags:
      - Weekly Feedback
      security:
      - bearer_auth: []
      description: Returns AI-generated weekly feedback for the current week. If not
        yet generated, returns 202 and queues generation. Use the 'Authorize' button
        at the top right to set your JWT token.
      responses:
        '200':
          description: feedback found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      feedback:
                        type: string
                        description: AI-generated feedback text
                      week_start:
                        type: string
                        format: date
                      generated_at:
                        type: string
                        format: date-time
                      stats:
                        type: object
                        nullable: true
                        description: Stats snapshot for the week
        '202':
          description: feedback not yet generated (queued)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: generating
                  message:
                    type: string
        '401':
          description: unauthorized
  "/api/v1/workout_templates":
    get:
      summary: List workout templates
      operationId: listWorkoutTemplates
      tags:
      - Workout Templates
      description: 'Returns all active workout templates. Optional: send JWT or session
        for has_active_workout and active_workout_id per template.'
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Optional JWT: Bearer <token> (shows active workout per template
          for user)'
        schema:
          type: string
      responses:
        '200':
          description: templates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WorkoutTemplate"
  "/api/v1/workout_templates/{id}":
    parameters:
    - name: id
      in: path
      description: Workout template ID
      required: true
      schema:
        type: integer
    get:
      summary: Get workout template
      operationId: getWorkoutTemplate
      tags:
      - Workout Templates
      description: Returns a single template with exercises. If authenticated, includes
        has_active_workout and active_workout_id.
      parameters:
      - name: Authorization
        in: header
        required: false
        description: 'Optional JWT: Bearer <token>'
        schema:
          type: string
      responses:
        '200':
          description: template found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/WorkoutTemplateWithExercises"
        '404':
          description: template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/workouts":
    get:
      summary: List workouts
      operationId: listWorkouts
      tags:
      - Workouts
      security:
      - bearer_auth: []
      description: Returns workouts for the authenticated user. Optionally filter
        by date range. Use JWT token from mobile login/signup.
      parameters:
      - name: start_date
        in: query
        format: date
        required: false
        description: Filter workouts on or after this date (YYYY-MM-DD)
        schema:
          type: string
      - name: end_date
        in: query
        format: date
        required: false
        description: Filter workouts on or before this date (YYYY-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: workouts list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/WorkoutWithExercises"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/workouts/{id}":
    parameters:
    - name: id
      in: path
      description: Workout ID
      required: true
      schema:
        type: integer
    get:
      summary: Get workout
      operationId: getWorkout
      tags:
      - Workouts
      security:
      - bearer_auth: []
      description: Returns a single workout with exercises and sets. Use JWT token
        from mobile login/signup.
      responses:
        '200':
          description: workout found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    "$ref": "#/components/schemas/WorkoutWithExercises"
        '404':
          description: workout not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: unauthorized
  "/api/v1/workouts/{id}/start":
    parameters:
    - name: id
      in: path
      description: Workout ID
      required: true
      schema:
        type: integer
    patch:
      summary: Start workout
      operationId: startWorkout
      tags:
      - Workouts
      security:
      - bearer_auth: []
      description: Marks the workout as started (sets started_at). Use JWT token from
        mobile login/signup.
      responses:
        '200':
          description: workout started
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout:
                    "$ref": "#/components/schemas/Workout"
        '404':
          description: workout not found
        '422':
          description: invalid transition (e.g. already started)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/workouts/{id}/complete":
    parameters:
    - name: id
      in: path
      description: Workout ID
      required: true
      schema:
        type: integer
    patch:
      summary: Complete workout
      operationId: completeWorkout
      tags:
      - Workouts
      security:
      - bearer_auth: []
      description: Marks the workout as completed. Workout must have been started
        first. Use JWT token from mobile login/signup.
      responses:
        '200':
          description: workout completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout:
                    "$ref": "#/components/schemas/Workout"
        '404':
          description: workout not found
        '422':
          description: invalid transition (e.g. not started)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/workout_templates/{id}/start":
    parameters:
    - name: id
      in: path
      description: Workout template ID
      required: true
      schema:
        type: integer
    post:
      summary: Start workout from template
      operationId: startWorkoutFromTemplate
      tags:
      - Workouts
      security:
      - bearer_auth: []
      description: Creates a new workout from a template and returns it. Optional
        scheduled_time (HH:MM).
      parameters:
      - name: scheduled_time
        in: query
        required: false
        description: Scheduled time of day (HH:MM)
        schema:
          type: string
      responses:
        '201':
          description: workout created from template
          content:
            application/json:
              schema:
                type: object
                properties:
                  workout:
                    "$ref": "#/components/schemas/WorkoutWithExercises"
        '404':
          description: template not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: active workout from this template already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  active_workout_id:
                    type: integer
servers:
- url: https://api.forge-fitness-journal.app
  description: Production server
- url: http://localhost:3000
  description: Development server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT token for mobile authentication. To test: 1) Call /api/v1/mobile/login
        or /api/v1/mobile/signup, 2) Copy the ''token'' from response, 3) Click ''Authorize''
        button and paste token (without ''Bearer'' prefix)'
    csrf_token:
      type: apiKey
      name: X-CSRF-Token
      in: header
      description: CSRF protection token (required for web POST/PUT/DELETE)
    session_cookie:
      type: apiKey
      name: Cookie
      in: header
      description: Session cookie (automatically set after web login)
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: john.doe@example.com
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Doe
        full_name:
          type: string
          example: John Doe
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - email
    UserRegistration:
      type: object
      properties:
        email:
